services:
  postgres:
    image: postgres:16-alpine
    container_name: mining_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - platform_net

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: mining_auth_service
    restart: always
    environment:
      AUTH_PORT: 4000
      NODE_ENV: production
      JWT_SECRET: super_secret_jwt_key_min_32_characters_long_12345
      JWT_ALGORITHM: HS256
      JWT_EXPIRES_IN: 8h
      AUTH_DATABASE_URL: postgresql://admin:secretpassword@postgres:5432/auth_db
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - platform_net

  business-service:
    build:
      context: ./business-service
      dockerfile: Dockerfile
    container_name: mining_business_service
    restart: always
    environment:
      BUSINESS_PORT: 8000
      JWT_SECRET: super_secret_jwt_key_min_32_characters_long_12345
      JWT_ALGORITHM: HS256
      BUSINESS_DATABASE_URL: postgresql://admin:secretpassword@postgres:5432/business_db
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - platform_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mining_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - auth-service
      - business-service
    networks:
      - platform_net

networks:
  platform_net:
    driver: bridge

volumes:
  pgdata:
