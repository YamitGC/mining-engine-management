version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mining_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    networks:
      - platform_net

networks:
  platform_net:
    driver: bridge

volumes:
  pgdata:
