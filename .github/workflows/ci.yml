name: CI/CD Pipeline - Mining Engine Management

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  # ========================================================
  # JOB 1: Pruebas y Compilación de Auth Service (Express + TS)
  # ========================================================
  auth-service:
    name: Auth Service (Node.js & Jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auth-service

    steps:
      - name: Descargar código fuente (Checkout)
        uses: actions/checkout@v4

      - name: Configurar entorno Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: auth-service/package.json

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar pruebas automatizadas con Jest
        run: npm test

      - name: Verificar compilación de TypeScript (Typecheck & Build)
        run: npm run build

  # ========================================================
  # JOB 2: Pruebas Automatizadas de Business Service (FastAPI)
  # ========================================================
  business-service:
    name: Business Service (Python & Pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: business-service

    steps:
      - name: Descargar código fuente (Checkout)
        uses: actions/checkout@v4

      - name: Configurar entorno Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: business-service/requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar pruebas automatizadas con Pytest
        run: pytest tests/ -v

  # ========================================================
  # JOB 3: Verificación de Construcción de Contenedores Docker
  # ========================================================
  docker-build-check:
    name: Docker Images Build Verification
    runs-on: ubuntu-latest
    needs: [auth-service, business-service]

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Construir imagen Docker de Auth Service
        run: docker build -t mining-auth-service:test ./auth-service

      - name: Construir imagen Docker de Business Service
        run: docker build -t mining-business-service:test ./business-service
